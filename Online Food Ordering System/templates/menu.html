
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu | Foodie</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>

<header class="navbar">
    <a class="logo" href="/">🍔 Foodie</a>
    <nav>
        <a href="/">Home</a>
        <a href="/menu">Menu</a>
        <a href="/cart">Cart ({{ cart_count }})</a>
        <a href="/orders">Orders</a>
    </nav>
</header>

<main class="container">
    <h1>Our Food Menu 🍽️</h1>
    <p class="muted">Fresh food, great taste, happy customers.</p>

    <div class="food-grid">
        {% for food in foods %}
        <article class="food-card">
            <div class="food-emoji">{{ food.emoji }}</div>
            <h3>{{ food.name }}</h3>
            <p>{{ food.description }}</p>
            <div class="card-bottom">
                <strong>₹{{ food.price }}</strong>
            </div>

            <form action="{{ url_for('add_to_cart', food_id=food.id) }}"
                  method="POST" class="add-form">
                <label for="qty-{{ food.id }}">Quantity</label>
                <input id="qty-{{ food.id }}" type="number"
                       name="quantity" value="1" min="1" max="20" required>
                <button type="submit" class="btn full-btn">
                    Add to Cart +
                </button>
            </form>
        </article>
        {% endfor %}
    </div>
</main>

<footer>
    <p>© 2026 Foodie | Online Food Ordering System</p>
</footer>

</body>
</html>
